<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring Tickets</title>
    <style>
        :root {
            --dark-orange: #FF4500;
            --light-orange: #FF8C00;
            --dark-bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        h1 {
            color: var(--light-orange);
            margin: 0;
            flex: 1;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            color: white;
        }

        .btn-orange {
            background-color: var(--dark-orange);
        }

        .btn-orange:hover {
            background-color: var(--light-orange);
            transform: translateY(-2px);
        }

        .btn-purple {
            background-color: #9c27b0;
            border: 2px solid #fff;
        }

        .btn-purple:hover {
            background-color: #7b1fa2;
        }

        .btn-secondary {
            background-color: #666;
        }

        .btn-secondary:hover {
            background-color: #555;
        }

        .filters-toggle-container {
            position: relative;
        }

        .filters-container {
            position: absolute;
            top: 60px;
            right: 0;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            min-width: 320px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            border: 2px solid var(--dark-orange);
        }

        .filters-container.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-label {
            display: block;
            color: var(--light-orange);
            font-size: 0.9em;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .filter-input,
        .filter-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #333;
            color: var(--text-color);
            font-size: 0.9em;
        }

        .filter-input:focus,
        .filter-select:focus {
            outline: none;
            border-color: var(--dark-orange);
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background-color: var(--card-bg);
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tickets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .ticket-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .ticket-card:hover {
            transform: translateY(-5px);
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--dark-orange);
        }

        .ticket-type {
            font-weight: bold;
            text-transform: uppercase;
            color: var(--dark-orange);
        }

        .ticket-id {
            font-size: 0.9em;
            color: var(--light-orange);
        }

        .pertes-indicator {
            background: #ff4444 !important;
            color: white !important;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-left: 8px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .ticket-status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-open {
            background-color: #ff4444;
            color: white;
        }

        .status-closed {
            background-color: #4CAF50;
            color: white;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .info-label {
            color: var(--light-orange);
            font-weight: bold;
        }

        .intervals {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }

        .interval-item {
            margin: 5px 0;
            padding: 5px;
            background-color: #333;
            border-radius: 4px;
        }

        .pertes-warnings {
            margin-top: 15px;
            padding: 10px;
            background-color: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 6px;
            max-height: 15em;
            overflow-y: auto;
        }

        .pertes-warning-item {
            margin: 8px 0;
            padding: 6px 10px;
            background-color: rgba(255, 107, 107, 0.15);
            border-left: 3px solid #ff6b6b;
            border-radius: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .modal-dialog {
            background: var(--card-bg);
            border-radius: 10px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--dark-orange);
        }

        .modal-header {
            background: var(--dark-orange);
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }

        .modal-body {
            padding: 25px;
        }

        .modal-body input {
            width: 100%;
            padding: 15px;
            border: 2px solid #555;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            background-color: var(--dark-bg);
            color: var(--text-color);
        }

        .modal-error {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ff6b6b;
            display: none;
        }

        .modal-footer {
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -500px;
            width: 500px;
            height: 100%;
            background-color: var(--card-bg);
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
            transition: right 0.3s ease;
            z-index: 1000;
            padding: 25px;
            overflow-y: auto;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar h2 {
            margin-top: 0;
            color: var(--light-orange);
            border-bottom: 2px solid var(--light-orange);
            padding-bottom: 10px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
        }

        .close-btn:hover {
            color: var(--light-orange);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-color);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: var(--dark-bg);
            color: var(--text-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .current-value {
            display: inline-block;
            background-color: var(--dark-orange);
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: bold;
            color: white;
        }

        fieldset {
            border: 1px solid #555;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: rgba(40, 40, 40, 0.5);
        }

        legend {
            color: var(--light-orange);
            font-weight: bold;
            padding: 0 10px;
        }

        @media (max-width: 768px) {
            .filters-container {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                min-width: 90vw;
                max-height: 80vh;
                overflow-y: auto;
            }

            .filters-container.show {
                transform: translate(-50%, -50%);
            }

            .sidebar {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Network Monitoring Tickets</h1>
            <div class="filters-toggle-container">
                <button class="btn btn-orange" data-action="toggleFilters">
                    🔍 Filters <span id="filter-arrow">▼</span>
                </button>
                <div class="filters-container" id="filters-container">
                    <div class="filter-label" style="text-align: center; margin-bottom: 15px;">🔍 Filters</div>
                    <div class="filter-group">
                        <label class="filter-label">ID Search:</label>
                        <input type="text" id="idSearch" class="filter-input" placeholder="Enter ticket ID...">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Type:</label>
                        <select id="typeFilter" class="filter-select">
                            <option value="">All Types</option>
                            {% for option in filter_options.types %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Site:</label>
                        <select id="siteFilter" class="filter-select">
                            <option value="">All Sites</option>
                            {% for option in filter_options.sites %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Database:</label>
                        <select id="databaseFilter" class="filter-select">
                            <option value="">All Databases</option>
                            {% for option in filter_options.databases %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Status:</label>
                        <select id="statusFilter" class="filter-select">
                            <option value="">All Status</option>
                            {% for option in filter_options.statuses %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Time Period:</label>
                        <select id="timeFilter" class="filter-select">
                            {% for option in filter_options.time_periods %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button class="btn btn-orange" style="flex: 1;" data-action="applyFilters">Apply</button>
                        <button class="btn btn-secondary" style="flex: 1;" data-action="clearFilters">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="results-info">
            <div>
                <span id="resultsCount">Loading tickets...</span>
                <span id="ttrSummary" style="color: var(--light-orange); margin-left: 20px;"></span>
            </div>
            <div class="button-group">
                <button class="btn btn-purple" data-action="goDashboard">📊 Dashboard</button>
                <button class="btn btn-orange" data-action="refresh">🔄 Refresh</button>
            </div>
        </div>
        <div id="activeFilters" style="color: var(--light-orange); font-size: 0.95em; margin-bottom: 10px;"></div>
        <div class="tickets-grid" id="tickets-container"></div>
    </div>


    <script src="/static/tickets.js"></script>
</body>

</html>
