<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring Tickets</title>
    <style>
        :root {
            --dark-orange: #FF4500;
            --light-orange: #FF8C00;
            --dark-bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        h1 {
            color: var(--light-orange);
            margin: 0;
            flex: 1;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            color: white;
        }

        .btn-orange {
            background-color: var(--dark-orange);
        }

        .btn-orange:hover {
            background-color: var(--light-orange);
            transform: translateY(-2px);
        }

        .btn-purple {
            background-color: #9c27b0;
            border: 2px solid #fff;
        }

        .btn-purple:hover {
            background-color: #7b1fa2;
        }

        .btn-secondary {
            background-color: #666;
        }

        .btn-secondary:hover {
            background-color: #555;
        }

        .filters-toggle-container {
            position: relative;
        }

        .filters-container {
            position: absolute;
            top: 60px;
            right: 0;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            min-width: 320px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            border: 2px solid var(--dark-orange);
        }

        .filters-container.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-label {
            display: block;
            color: var(--light-orange);
            font-size: 0.9em;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .filter-input,
        .filter-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #333;
            color: var(--text-color);
            font-size: 0.9em;
        }

        .filter-input:focus,
        .filter-select:focus {
            outline: none;
            border-color: var(--dark-orange);
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background-color: var(--card-bg);
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tickets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .ticket-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .ticket-card:hover {
            transform: translateY(-5px);
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--dark-orange);
        }

        .ticket-type {
            font-weight: bold;
            text-transform: uppercase;
            color: var(--dark-orange);
        }

        .ticket-id {
            font-size: 0.9em;
            color: var(--light-orange);
        }

        .pertes-indicator {
            background: #ff4444 !important;
            color: white !important;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-left: 8px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .ticket-status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-open {
            background-color: #ff4444;
            color: white;
        }

        .status-closed {
            background-color: #4CAF50;
            color: white;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .info-label {
            color: var(--light-orange);
            font-weight: bold;
        }

        .intervals {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }

        .interval-item {
            margin: 5px 0;
            padding: 5px;
            background-color: #333;
            border-radius: 4px;
        }

        .pertes-warnings {
            margin-top: 15px;
            padding: 10px;
            background-color: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 6px;
            max-height: 15em;
            overflow-y: auto;
        }

        .pertes-warning-item {
            margin: 8px 0;
            padding: 6px 10px;
            background-color: rgba(255, 107, 107, 0.15);
            border-left: 3px solid #ff6b6b;
            border-radius: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .modal-dialog {
            background: var(--card-bg);
            border-radius: 10px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--dark-orange);
        }

        .modal-header {
            background: var(--dark-orange);
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }

        .modal-body {
            padding: 25px;
        }

        .modal-body input {
            width: 100%;
            padding: 15px;
            border: 2px solid #555;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            background-color: var(--dark-bg);
            color: var(--text-color);
        }

        .modal-error {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ff6b6b;
            display: none;
        }

        .modal-footer {
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -500px;
            width: 500px;
            height: 100%;
            background-color: var(--card-bg);
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
            transition: right 0.3s ease;
            z-index: 1000;
            padding: 25px;
            overflow-y: auto;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar h2 {
            margin-top: 0;
            color: var(--light-orange);
            border-bottom: 2px solid var(--light-orange);
            padding-bottom: 10px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
        }

        .close-btn:hover {
            color: var(--light-orange);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-color);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: var(--dark-bg);
            color: var(--text-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .current-value {
            display: inline-block;
            background-color: var(--dark-orange);
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: bold;
            color: white;
        }

        fieldset {
            border: 1px solid #555;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: rgba(40, 40, 40, 0.5);
        }

        legend {
            color: var(--light-orange);
            font-weight: bold;
            padding: 0 10px;
        }

        @media (max-width: 768px) {
            .filters-container {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                min-width: 90vw;
                max-height: 80vh;
                overflow-y: auto;
            }

            .filters-container.show {
                transform: translate(-50%, -50%);
            }

            .sidebar {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Network Monitoring Tickets</h1>
            <div class="filters-toggle-container">
                <button class="btn btn-orange" onclick="UI.toggleFilters()">
                    🔍 Filters <span id="filter-arrow">▼</span>
                </button>
                <div class="filters-container" id="filters-container">
                    <div class="filter-label" style="text-align: center; margin-bottom: 15px;">🔍 Filters</div>
                    <div class="filter-group">
                        <label class="filter-label">ID Search:</label>
                        <input type="text" id="idSearch" class="filter-input" placeholder="Enter ticket ID...">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Type:</label>
                        <select id="typeFilter" class="filter-select">
                            <option value="">All Types</option>
                            {% for option in filter_options.types %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Site:</label>
                        <select id="siteFilter" class="filter-select">
                            <option value="">All Sites</option>
                            {% for option in filter_options.sites %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Database:</label>
                        <select id="databaseFilter" class="filter-select">
                            <option value="">All Databases</option>
                            {% for option in filter_options.databases %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Status:</label>
                        <select id="statusFilter" class="filter-select">
                            <option value="">All Status</option>
                            {% for option in filter_options.statuses %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Time Period:</label>
                        <select id="timeFilter" class="filter-select">
                            {% for option in filter_options.time_periods %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button class="btn btn-orange" style="flex: 1;" onclick="Filters.apply()">Apply</button>
                        <button class="btn btn-secondary" style="flex: 1;" onclick="Filters.clear()">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="results-info">
            <div>
                <span id="resultsCount">Loading tickets...</span>
                <span id="ttrSummary" style="color: var(--light-orange); margin-left: 20px;"></span>
            </div>
            <div class="button-group">
                <button class="btn btn-purple" onclick="window.location.href='/'">📊 Dashboard</button>
                <button class="btn btn-orange" onclick="Data.fetch()">🔄 Refresh</button>
            </div>
        </div>
        <div id="activeFilters" style="color: var(--light-orange); font-size: 0.95em; margin-bottom: 10px;"></div>
        <div class="tickets-grid" id="tickets-container"></div>
    </div>


    <script>
        // State Management
        const State = {
            allTickets: [],
            filteredTickets: [],
            currentCriteria: {
                alert_pertes_threshold: 3.0  // Default value to prevent errors
            },
            filtersVisible: false
        };

        // Utility Functions
        const Utils = {
            formatDate: (dateString) => new Date(dateString).toLocaleString(),

            getDateRange: (period) => {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const ranges = {
                    today: { start: today, end: new Date(today.getTime() + 86400000) },
                    yesterday: { start: new Date(today.getTime() - 86400000), end: today },
                    week: { start: new Date(today.getTime() - 604800000), end: new Date(today.getTime() + 86400000) },
                    month: { start: new Date(today.getTime() - 2592000000), end: new Date(today.getTime() + 86400000) },
                    current_month: { start: new Date(now.getFullYear(), now.getMonth(), 1), end: new Date(now.getFullYear(), now.getMonth() + 1, 1) }
                };
                return ranges[period] || null;
            },

            formatTTR: (seconds) => {
                const days = Math.floor(seconds / 86400);
                const hours = Math.floor((seconds % 86400) / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                if (days > 0) return `${days}d ${hours}h ${minutes}m`;
                if (hours > 0) return `${hours}h ${minutes}m`;
                return `${minutes}m`;
            }
        };

        // Data Management
        const Data = {
            fetch: async () => {
                try {
                    document.getElementById('resultsCount').textContent = 'Loading tickets...';
                    const response = await fetch('/tickets/api');
                    State.allTickets = await response.json();
                    if (document.getElementById('timeFilter').value === 'all' && !document.getElementById('idSearch').value) {
                        document.getElementById('timeFilter').value = 'current_month';
                    }
                    Filters.apply();
                } catch (error) {
                    console.error('Error:', error);
                    document.getElementById('resultsCount').textContent = 'Error loading tickets';
                }
            }
        };

        // Filter Management
        const Filters = {
            apply: () => {
                const filters = {
                    id: document.getElementById('idSearch').value.toLowerCase().trim(),
                    type: document.getElementById('typeFilter').value,
                    site: document.getElementById('siteFilter').value,
                    database: document.getElementById('databaseFilter').value,
                    status: document.getElementById('statusFilter').value,
                    time: document.getElementById('timeFilter').value
                };

                State.filteredTickets = State.allTickets.filter(ticket => {
                    if (filters.id && !ticket.id.toString().toLowerCase().includes(filters.id)) return false;
                    if (filters.type && ticket.type !== filters.type) return false;
                    if (filters.site && ticket.site !== filters.site) return false;
                    if (filters.database && ticket.database_name !== filters.database) return false;
                    if (filters.status && ticket.status !== filters.status) return false;
                    if (filters.time !== 'all') {
                        const dateRange = Utils.getDateRange(filters.time);
                        if (dateRange) {
                            const ticketDate = new Date(ticket.timestamp);
                            if (ticketDate < dateRange.start || ticketDate >= dateRange.end) return false;
                        }
                    }
                    return true;
                });

                UI.displayTickets();
                UI.showActiveFilters(filters);
            },

            clear: () => {
                document.getElementById('idSearch').value = '';
                ['typeFilter', 'siteFilter', 'databaseFilter', 'statusFilter'].forEach(id => {
                    document.getElementById(id).value = '';
                });
                document.getElementById('timeFilter').value = 'current_month';
                Filters.apply();
            }
        };

        // UI Management
        const UI = {
            toggleFilters: () => {
                const container = document.getElementById('filters-container');
                const arrow = document.getElementById('filter-arrow');
                State.filtersVisible = !State.filtersVisible;
                container.classList.toggle('show', State.filtersVisible);
                arrow.textContent = State.filtersVisible ? '▲' : '▼';
            },

            createTicketCard: (ticket) => {
                const hasPertes = ticket.type === 'traffic' && ticket.pertes_warnings?.length > 0;
                const slicedValues = ticket.last_values?.slice(1) || [];

                return `
                    <div class="ticket-card">
                        <div class="ticket-header">
                            <div>
                                <span class="ticket-type">${ticket.type}</span>
                                <span class="ticket-id">#${ticket.id}</span>
                                ${hasPertes ? '<span class="pertes-indicator">Pertes: High</span>' : ''}
                            </div>
                            <span class="ticket-status status-${ticket.status}">${ticket.status}</span>
                        </div>
                        <div class="ticket-info">
                            <div class="info-row"><span class="info-label">Agent:</span><span>${ticket.agent || '-'}</span></div>
                            <div class="info-row"><span class="info-label">Severity:</span><span>${ticket.severity || '-'}</span></div>
                            <div class="info-row"><span class="info-label">Orange Ticket:</span><span style="color: var(--light-orange); font-weight: bold;">${ticket.orange_ticket_id || ticket.external_api_ticket_id || 'N/A'}</span></div>
                            <div class="info-row"><span class="info-label">Site:</span><span>${ticket.site || '-'}</span></div>
                            <div class="info-row"><span class="info-label">Database:</span><span>${ticket.database_name || '-'}</span></div>
                            <div class="info-row"><span class="info-label">Timestamp:</span><span>${ticket.timestamp ? Utils.formatDate(ticket.timestamp) : '-'}</span></div>
                            <div class="info-row"><span class="info-label">Value:</span><span>${ticket.value !== undefined ? `${ticket.value}${ticket.type === 'pertes' ? ' %' : ticket.type === 'traffic' ? ' Gb/s' : ticket.type === 'db_down' ? ' min' : ''}` : '-'}</span></div>
                            ${ticket.type === 'traffic' ? `<div class="info-row"><span class="info-label">Pertes:</span><span style="color: ${ticket.pertes === 'Yes' ? '#ff4444' : '#4CAF50'}; font-weight: bold;">${ticket.pertes || 'No'}</span></div>` : ''}
                            <div class="info-row"><span>${ticket.reason || '-'}</span></div>
                            ${ticket.status === 'closed' && ticket.closure_timestamp ? `
                                <div class="info-row"><span class="info-label">Closed At:</span><span>${Utils.formatDate(ticket.closure_timestamp)}</span></div>
                                ${ticket.human_readable ? `<div class="info-row"><span class="info-label">TTR:</span><span style="color: var(--light-orange); font-weight: bold;">${ticket.human_readable}</span></div>` : ''}
                            ` : ''}
                            ${slicedValues.length > 0 && ticket.type === 'traffic' ? `
                                <div class="intervals">
                                    <div class="info-label">Traffic Values:</div>
                                    ${slicedValues.map(v => `<div class="interval-item">${v.timestamp.slice(0, 16)} | ${v.value} Gb/s</div>`).join('')}
                                </div>
                            ` : ''}
                            ${ticket.type === 'pertes' && slicedValues.length > 0 ? `
                                <div class="intervals">
                                    <div class="info-label">Previous Pertes Values:</div>
                                    ${slicedValues.map(v => `<div class="interval-item" style="color: ${Number(v.value) > State.currentCriteria.alert_pertes_threshold ? '#ff6b6b' : '#4CAF50'}">${v.timestamp.slice(0, 16)} | ${v.value}%</div>`).join('')}
                                </div>
                            ` : ''}
                            ${hasPertes ? `
                                <div class="pertes-warnings">
                                    <div class="info-label" style="color: #ff6b6b; font-weight: bold;">⚠️ High Packet Loss Detected:</div>
                                    ${ticket.pertes_warnings.map(w => `<div class="pertes-warning-item"><span style="color: #ff6b6b; font-size: 0.9em;">${w.timestamp} - ${w.loss_percentage}% packet loss</span></div>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            },

            displayTickets: () => {
                const sorted = [...State.filteredTickets].sort((a, b) => {
                    if (a.status === 'open' && b.status === 'closed') return -1;
                    if (a.status === 'closed' && b.status === 'open') return 1;
                    return new Date(b.timestamp) - new Date(a.timestamp);
                });

                const container = document.getElementById('tickets-container');
                document.getElementById('resultsCount').textContent = `Showing ${sorted.length} of ${State.allTickets.length} tickets`;

                if (sorted.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--light-orange); font-size: 1.2em; padding: 40px;">No tickets found</div>';
                } else {
                    container.innerHTML = sorted.map(t => UI.createTicketCard(t)).join('');
                }

                UI.updateTTRSummary(sorted);
            },

            updateTTRSummary: (tickets) => {
                const closed = tickets.filter(t => t.status === 'closed' && t.ttr?.seconds);
                const summary = document.getElementById('ttrSummary');
                if (closed.length === 0) {
                    summary.textContent = '';
                    return;
                }
                const avgTTR = closed.reduce((sum, t) => sum + t.ttr.seconds, 0) / closed.length;
                summary.textContent = `Avg TTR: ${Utils.formatTTR(avgTTR)} (${closed.length} closed tickets)`;
            },

            showActiveFilters: (filters) => {
                const active = [];
                if (filters.id) active.push(`ID: <b>${filters.id}</b>`);
                if (filters.type) active.push(`Type: <b>${filters.type}</b>`);
                if (filters.site) active.push(`Site: <b>${filters.site}</b>`);
                if (filters.database) active.push(`Database: <b>${filters.database}</b>`);
                if (filters.status) active.push(`Status: <b>${filters.status}</b>`);
                if (filters.time && filters.time !== 'all') {
                    const labels = { today: "Today", yesterday: "Yesterday", week: "Last 7 Days", month: "Last 30 Days", current_month: "Current Month" };
                    active.push(`Time: <b>${labels[filters.time]}</b>`);
                }
                document.getElementById('activeFilters').innerHTML = active.length > 0 ? `Active Filters: ${active.join(' | ')}` : '';
            },

            openSummaryTable: () => window.location.href = '/'
        };

        // Load criteria on page load for filtering purposes only
        const loadCriteriaForFiltering = async () => {
            try {
                const r = await fetch('/api/config');
                if (r.ok) {
                    const response = await r.json();
                    try {
                        const criteria = response.data;
                        // Merge with defaults to ensure all properties exist
                        State.currentCriteria = {
                            alert_pertes_threshold: 3.0,
                            ...criteria
                        };
                    } catch (parseError) {
                        console.error('Invalid JSON response:', response);
                    }
                }
            } catch (error) {
                console.error('Error loading criteria:', error);
            }
        };

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Load criteria on page load for filtering purposes only
            loadCriteriaForFiltering();

            // Filter event listeners
            ['idSearch', 'typeFilter', 'siteFilter', 'databaseFilter', 'statusFilter', 'timeFilter'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener(id === 'idSearch' ? 'input' : 'change', Filters.apply);
                }
            });

            // Close filters on outside click
            document.addEventListener('click', (e) => {
                const container = document.querySelector('.filters-toggle-container');
                if (container && !container.contains(e.target) && State.filtersVisible) {
                    UI.toggleFilters();
                }
            });

            // Initial load
            Data.fetch();

            // Auto-refresh every 5 minutes
            setInterval(Data.fetch, 300000);
        });
    </script>
</body>

</html>
