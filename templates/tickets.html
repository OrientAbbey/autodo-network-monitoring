<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring Tickets</title>
    <link rel="stylesheet" type="text/css" href="/static/css/tokens.css">
    <link rel="stylesheet" type="text/css" href="/static/css/tickets.css">
    <link rel="stylesheet" type="text/css" href="/static/app-ui.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Network Monitoring Tickets</h1>
            <div class="header-tools"><button id="prefsBtn" class="btn-secondary" type="button" data-action="openPrefs" data-i18n-attr="title:prefs.title;aria-label:prefs.title" title="Préférences" aria-label="Préférences">🎛️</button><div id="account-widget" class="account-widget"></div></div>
            <div class="filters-toggle-container">
                <button class="btn-primary" data-action="toggleFilters" aria-label="Afficher ou masquer les filtres">
                    🔍 Filters <span id="filter-arrow">▼</span>
                </button>
                <div class="filters-container" id="filters-container">
                    <div class="filter-label" style="text-align: center; margin-bottom: 15px;">🔍 Filters</div>
                    <div class="filter-group">
                        <label class="filter-label">ID Search:</label>
                        <input type="text" id="idSearch" class="filter-input" placeholder="Enter ticket ID...">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Type:</label>
                        <select id="typeFilter" class="filter-select">
                            <option value="">All Types</option>
                            {% for option in filter_options.types %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Site:</label>
                        <select id="siteFilter" class="filter-select">
                            <option value="">All Sites</option>
                            {% for option in filter_options.sites %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Database:</label>
                        <select id="databaseFilter" class="filter-select">
                            <option value="">All Databases</option>
                            {% for option in filter_options.databases %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Status:</label>
                        <select id="statusFilter" class="filter-select">
                            <option value="">All Status</option>
                            {% for option in filter_options.statuses %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Time Period:</label>
                        <select id="timeFilter" class="filter-select">
                            {% for option in filter_options.time_periods %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button class="btn-primary" style="flex: 1;" data-action="applyFilters">Apply</button>
                        <button class="btn-secondary" style="flex: 1;" data-action="clearFilters">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="results-info">
            <div>
                <span id="resultsCount">Loading tickets...</span>
                <span id="ttrSummary" style="color: var(--light-orange); margin-left: 20px;"></span>
            </div>
            <div class="button-group">
                <button class="btn-secondary" data-action="goDashboard">📊 Dashboard</button>
                <button class="btn-primary" data-action="refresh" aria-label="Actualiser la liste des tickets">🔄 Refresh</button>
            </div>
        </div>
        <div id="activeFilters" style="color: var(--light-orange); font-size: 0.95em; margin-bottom: 10px;"></div>
        <div class="tickets-grid" id="tickets-container"></div>
    </div>


    <script src="/static/js/common.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/prefs.js"></script>
    <script src="/static/js/session.js"></script>
    <script src="/static/js/sound.js"></script>
    <script src="/static/js/a11y.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/page-kit.js"></script>
    <script src="/static/js/ticket-actions.js"></script>
    <script src="/static/tickets.js"></script>
</body>

</html>
