<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring Tickets</title>
    <link rel="stylesheet" type="text/css" href="/static/css/tokens.css">
    <link rel="stylesheet" type="text/css" href="/static/css/tickets.css">
    <link rel="stylesheet" type="text/css" href="/static/app-ui.css">
</head>

<body>
    <header class="app-bar">
        <div class="app-bar__brand"><h1 class="app-bar__title">AUTODO</h1></div>
        <nav class="app-nav" aria-label="Navigation">
            <a href="/" data-i18n="nav.dashboard">Tableau de bord</a>
            <a href="/tickets/" aria-current="page" data-i18n="header.tickets">Tickets</a>
            <a href="/supervision" data-i18n="nav.supervision">Supervision</a>
            <a href="/admin" data-i18n="nav.admin">Admin</a>
        </nav>
        <div class="app-bar__actions">
            <button id="prefsBtn" class="btn-secondary btn-icon" type="button" data-action="openPrefs" data-i18n-attr="title:prefs.title;aria-label:prefs.title" title="Préférences" aria-label="Préférences">🎛️</button>
            <div id="account-widget" class="account-widget"></div>
        </div>
    </header>
    <div class="container">
        <h2 class="page-heading">Network Monitoring Tickets</h2>
        <div class="results-info">
            <div>
                <span id="resultsCount">Loading tickets...</span>
                <span id="ttrSummary" class="results-ttr"></span>
            </div>
            <div class="button-group">
                <div class="filters-toggle-container">
                <button class="btn-secondary" data-action="toggleFilters" aria-label="Afficher ou masquer les filtres">
                    🔍 Filters <span id="filter-arrow">▼</span>
                </button>
                <div class="filters-container" id="filters-container">
                    <div class="filter-label filter-heading">🔍 Filters</div>
                    <div class="filter-group">
                        <label class="filter-label">ID Search:</label>
                        <input type="text" id="idSearch" class="filter-input" placeholder="Enter ticket ID...">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Type:</label>
                        <select id="typeFilter" class="filter-select">
                            <option value="">All Types</option>
                            {% for option in filter_options.types %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Site:</label>
                        <select id="siteFilter" class="filter-select">
                            <option value="">All Sites</option>
                            {% for option in filter_options.sites %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Database:</label>
                        <select id="databaseFilter" class="filter-select">
                            <option value="">All Databases</option>
                            {% for option in filter_options.databases %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Status:</label>
                        <select id="statusFilter" class="filter-select">
                            <option value="">All Status</option>
                            {% for option in filter_options.statuses %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Time Period:</label>
                        <select id="timeFilter" class="filter-select">
                            {% for option in filter_options.time_periods %}
                            <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-actions">
                        <button class="btn-primary" data-action="applyFilters">Apply</button>
                        <button class="btn-secondary" data-action="clearFilters">Clear</button>
                    </div>
                </div>
            </div>
                <button class="btn-primary" data-action="refresh" aria-label="Actualiser la liste des tickets">🔄 Refresh</button>
            </div>
        </div>
        <div id="activeFilters" class="results-filters"></div>
        <div class="tickets-grid" id="tickets-container"></div>
    </div>


    <script src="/static/js/common.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/prefs.js"></script>
    <script src="/static/js/session.js"></script>
    <script src="/static/js/sound.js"></script>
    <script src="/static/js/a11y.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/page-kit.js"></script>
    <script src="/static/js/ticket-actions.js"></script>
    <script src="/static/tickets.js"></script>
</body>

</html>
